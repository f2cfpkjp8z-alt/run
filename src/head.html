<title>Pace &amp; Pulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: app shell — top bar with tabs (desktop) / bottom tab bar (phone); each tab is a view of summary tiles, charts and ledgers. */
:root {
  --bg: #f3f6f8; --surface: #ffffff; --sunk: #eaeff3; --ink: #0f1b26; --ink2: #44525f; --muted: #6c7a87; --line: #d9e0e6;
  --accent: #2a78d6; --accent-ink: #1c5cab; --accent-soft: #dceafb; --s2: #eb6834; --hr: #e34948; --elev: #1baf7a;
  --good: #0ca30c; --good-ink: #0a7a0a; --warn: #fab219; --warn-ink: #8a5c00; --crit: #d03b3b;
  --z1: #86b6ef; --z2: #5598e7; --z3: #2a78d6; --z4: #1c5cab; --z5: #104281;
  --display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --body: "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --r: 12px; --bnav-h: 0px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1217; --surface: #151c23; --sunk: #1b232b; --ink: #edf2f6; --ink2: #b3c0cb; --muted: #8796a3; --line: #27313b;
  --accent: #3987e5; --accent-ink: #86b6ef; --accent-soft: #17304d; --s2: #d95926; --hr: #e66767; --elev: #199e70;
  --good-ink: #4fd04f; --warn-ink: #fab219;
  --z1: #184f95; --z2: #1c5cab; --z3: #2a78d6; --z4: #5598e7; --z5: #9ec5f4; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0d1217; --surface: #151c23; --sunk: #1b232b; --ink: #edf2f6; --ink2: #b3c0cb; --muted: #8796a3; --line: #27313b;
  --accent: #3987e5; --accent-ink: #86b6ef; --accent-soft: #17304d; --s2: #d95926; --hr: #e66767; --elev: #199e70;
  --good-ink: #4fd04f; --warn-ink: #fab219;
  --z1: #184f95; --z2: #1c5cab; --z3: #2a78d6; --z4: #5598e7; --z5: #9ec5f4; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 400 15px/1.5 var(--body); -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1200px; margin: 0 auto; padding-inline: 16px; }
h1, h2, h3 { font-family: var(--display); font-weight: 600; letter-spacing: .01em; margin: 0; text-wrap: balance; }
h2 { font-size: 1.7rem; line-height: 1.1; }
h3 { font-size: 1.05rem; text-transform: uppercase; letter-spacing: .07em; color: var(--ink2); font-weight: 600; }
a { color: var(--accent-ink); }
.muted { color: var(--muted); margin: 0; } .sm { font-size: 13px; }
.eyebrow { margin: 0 0 2px; font: 600 12px/1.2 var(--body); text-transform: uppercase; letter-spacing: .1em; color: var(--accent-ink); }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
button, .btn { font: 600 14px/1 var(--body); border-radius: 9px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  padding: 10px 14px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; text-decoration: none; }
button:hover, .btn:hover { border-color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.primary:hover { filter: brightness(1.08); }
.ghost { background: transparent; }
.danger { color: var(--crit); }
.danger.armed { background: var(--crit); color: #fff; border-color: var(--crit); }
.link { background: none; border: 0; color: var(--accent-ink); text-decoration: underline; text-underline-offset: 3px; padding: 8px 0; min-height: 0; }
.wide { width: 100%; }
#file, #folder { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
input, select, textarea { font: 15px var(--body); padding: 10px 12px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); min-height: 42px; width: 100%; }
textarea { font: 12px/1.5 var(--mono); min-height: 120px; resize: vertical; }

/* ---------- top bar & tabs ---------- */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: color-mix(in srgb, var(--surface) 90%, transparent);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; gap: 16px; min-height: 60px; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; flex: none; }
.brand-t { font: 700 1.45rem/1 var(--display); letter-spacing: .01em; }
.brand small { display: block; font: 500 13px/1.3 var(--body); color: var(--muted); }
.tabs { display: flex; gap: 2px; height: 60px; margin-right: auto; }
.tabs a { display: flex; align-items: center; padding: 0 14px; color: var(--ink2); text-decoration: none; font-weight: 600; font-size: 15px; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs a:hover { color: var(--ink); }
.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--accent); }
.top-actions { display: flex; align-items: center; gap: 10px; margin-left: auto; }
.avatar { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; padding: 0; background: var(--accent-soft); color: var(--accent-ink); font: 700 15px/1 var(--body); border: 1px solid transparent; }
.avatar.guest { background: var(--sunk); color: var(--muted); }
.menu-wrap { position: relative; }
.menu { position: absolute; right: 0; top: calc(100% + 8px); width: min(300px, calc(100vw - 32px)); padding: 8px; z-index: 40; box-shadow: 0 12px 32px rgb(0 0 0 / .18); }
.menu .who { padding: 10px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
.menu .who b { display: block; } .menu .who span { color: var(--muted); font-size: 13px; }
.menu button { width: 100%; justify-content: flex-start; border: 0; background: transparent; font-weight: 500; }
.menu button:hover { background: var(--sunk); }
.menu .lbl { font: 600 11px/1 var(--body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 10px 10px 4px; }
.bnav { display: none; }
@media (max-width: 820px) {
  :root { --bnav-h: 62px; }
  .tabs { display: none; }
  .hide-sm { display: none; }
  .bnav { display: grid; grid-template-columns: repeat(6, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    background: color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .bnav a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; height: var(--bnav-h); color: var(--muted); text-decoration: none; font: 600 11px/1 var(--body); }
  .bnav a[aria-current="page"] { color: var(--accent-ink); }
  .bnav svg { width: 22px; height: 22px; }
  .main { padding-bottom: calc(var(--bnav-h) + 24px + env(safe-area-inset-bottom, 0px)) !important; }
}
.main { padding-block: 8px 48px; }
.banner { margin-top: 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 12px 14px; border-radius: var(--r); background: var(--accent-soft); font-size: 14px; }
.banner .grow { flex: 1 1 260px; min-width: 0; }
.banner.warn { background: color-mix(in srgb, var(--warn) 22%, var(--surface)); }
.status { font-size: 13px; color: var(--ink2); min-height: 1.2em; margin-top: 8px; }
.view { margin-top: 12px; }
.vh { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 8px 0 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; }
.ch { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
footer { color: var(--muted); font-size: 13px; padding-block: 28px 8px; }

/* ---------- tiles ---------- */
.hero { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); }
.tile { display: flex; flex-direction: column; gap: 10px; }
.tile .label { font: 600 12px/1 var(--body); text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }
.big { font: 700 3.5rem/0.9 var(--display); letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.big small { font: 500 14px/1 var(--body); color: var(--muted); margin-left: 6px; letter-spacing: 0; }
.chip { display: inline-flex; align-items: center; gap: 6px; font: 600 12px/1 var(--body); padding: 5px 9px; border-radius: 999px; background: var(--sunk); color: var(--ink2); width: fit-content; white-space: nowrap; }
.chip i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; display: inline-block; }
.chip.good { color: var(--good-ink); } .chip.warn { color: var(--warn-ink); } .chip.crit { color: var(--crit); } .chip.acc { color: var(--accent-ink); }
.sub { font-size: 13px; color: var(--ink2); } .sub .num { color: var(--ink); }
.delta-up { color: var(--good-ink); } .delta-down { color: var(--crit); }
.scale { position: relative; height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--z1), var(--z3), var(--z5)); margin-top: 4px; }
.scale b { position: absolute; top: -4px; width: 4px; height: 16px; border-radius: 2px; background: var(--ink); box-shadow: 0 0 0 2px var(--surface); transform: translateX(-2px); }
.scale-l { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 4px; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-size: 14px; margin: 0; }
.kv dt { color: var(--ink2); } .kv dd { margin: 0; text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.kv dd small { color: var(--muted); font-size: 12px; margin-left: 6px; }
.grid-ov { display: grid; gap: 12px; margin-top: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); }

/* latest workout card */
.latest { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
.latest .mini-map { aspect-ratio: 4 / 3; max-width: 100%; border-radius: 10px; overflow: hidden; background: var(--sunk); }
.latest .mini-map svg { width: 100%; height: 100%; display: block; }
@media (max-width: 520px) { .latest { grid-template-columns: 1fr; } }

/* ---------- charts ---------- */
.seg { display: inline-flex; background: var(--sunk); border-radius: 9px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; min-height: 32px; padding: 6px 12px; color: var(--ink2); }
.seg button[aria-pressed="true"], .seg button[aria-selected="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .12); }
.seg-wide { display: flex; } .seg-wide button { flex: 1; }
.charts { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); }
.chart-card h3 { margin-bottom: 2px; }
.chart-card .cap { font-size: 13px; color: var(--muted); margin: 0 0 8px; }
.plot { position: relative; width: 100%; }
.plot svg { display: block; width: 100%; height: auto; overflow: visible; touch-action: pan-y; }
.plot .ax { fill: var(--muted); font: 11px var(--mono); }
.plot .grid { stroke: var(--line); stroke-width: 1; }
.plot .base { stroke: var(--ink2); stroke-width: 1; opacity: .5; }
.plot .xh { stroke: var(--ink2); stroke-width: 1; stroke-dasharray: 3 3; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--ink2); margin-bottom: 6px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
.legend i.dot { width: 9px; height: 9px; border-radius: 50%; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); border-radius: 8px; padding: 8px 10px; font-size: 12px; line-height: 1.45; white-space: nowrap; z-index: 5; box-shadow: 0 6px 18px rgb(0 0 0 / .2); }
.tip b { font-weight: 700; } .tip .sw { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.empty { color: var(--muted); font-size: 14px; padding: 24px 0; text-align: center; margin: 0; }

/* ---------- bars / tables ---------- */
.two { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); }
.bars { display: grid; gap: 12px; }
.bar-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; font-size: 14px; }
.bar-row .track { grid-column: 1 / -1; height: 8px; border-radius: 4px; background: var(--sunk); overflow: hidden; }
.bar-row .track i { display: block; height: 100%; border-radius: 4px; background: var(--accent); }
.bar-row .v { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--ink2); font-size: 13px; }
.bar-row .hint { grid-column: 1 / -1; font-size: 12px; color: var(--muted); margin-top: -2px; }
table.tb { width: 100%; border-collapse: collapse; font-size: 14px; }
table.tb th { text-align: left; font: 600 11px/1.2 var(--body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 8px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.tb td { padding: 9px 8px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; white-space: nowrap; }
table.tb td.n, table.tb th.n { text-align: right; } table.tb td.n { font-family: var(--mono); font-size: 13px; }
table.tb tr.pb td:first-child { font-weight: 700; }
table.tb .barcell { position: relative; } table.tb .barcell i { position: absolute; left: 0; top: 25%; bottom: 25%; background: var(--accent-soft); border-radius: 3px; z-index: 0; } table.tb .barcell span { position: relative; }
.scroll-x { overflow-x: auto; }

/* ---------- workouts ledger ---------- */
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.toolbar input { flex: 1 1 220px; width: auto; } .toolbar select { width: auto; flex: 0 1 auto; }
.ledger-card { padding: 4px 8px 8px; }
.ledger-head, .row { display: grid; grid-template-columns: 44px 104px minmax(0, 1.5fr) repeat(6, minmax(0, .8fr)); gap: 10px; align-items: center; padding: 10px 10px; }
.ledger-head { font: 600 11px/1.2 var(--body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); border-bottom: 1px solid var(--line); }
.ledger-head span:nth-child(n+4), .row .m { text-align: right; }
.row { width: 100%; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: transparent; text-align: left; font: inherit; min-height: 0; cursor: pointer; color: var(--ink); }
a.row { text-decoration: none; }
.row:hover { background: var(--sunk); border-color: var(--line); }
.row .glyph { width: 40px; height: 40px; border-radius: 8px; background: var(--sunk); display: grid; place-items: center; }
.row .glyph svg { width: 34px; height: 34px; }
.row .d { font-size: 13px; color: var(--ink2); line-height: 1.3; } .row .d span { display: block; color: var(--muted); font-size: 12px; }
.row .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .nm small { font-weight: 500; color: var(--muted); margin-left: 6px; font-size: 11px; border: 1px solid var(--line); border-radius: 4px; padding: 1px 4px; }
.row .m { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 14px; }
.row .m em { display: none; font-style: normal; font-family: var(--body); color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
.more { margin: 12px auto 0; display: flex; }
@media (max-width: 820px) {
  .ledger-head { display: none; }
  .row { grid-template-columns: 44px repeat(3, minmax(0, 1fr)); gap: 6px 10px; padding: 12px 4px; }
  .row .glyph { grid-row: 1 / 3; }
  .row .nm { grid-column: 2 / 4; grid-row: 1; } .row .d { grid-column: 4; grid-row: 1; text-align: right; } .row .d span { display: none; }
  .row .m { text-align: left; } .row .m em { display: block; }
  .row .m.xs { display: none; }
  .big { font-size: 3rem; }
}

/* ---------- workout detail ---------- */
.back { margin-bottom: 8px; }
.wd-head { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; margin-bottom: 14px; }
.wd-head h2 { font-size: 2rem; }
.wd-head p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }
.stats { display: grid; gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
.stat { padding: 11px 13px; box-shadow: inset -1px -1px 0 var(--line); }
.stat span { display: block; font: 600 11px/1.2 var(--body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.stat b { font: 600 1.4rem/1.2 var(--display); font-variant-numeric: tabular-nums; }
.stat b small { font: 500 12px var(--body); color: var(--muted); margin-left: 3px; }
.wd-grid { display: grid; gap: 12px; margin-top: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); }
.span2 { grid-column: 1 / -1; }

/* map */
.map { position: relative; width: 100%; height: clamp(260px, 52vw, 460px); border-radius: 10px; overflow: hidden; background: var(--sunk); touch-action: none; cursor: grab; user-select: none; }
.map.no-tiles { background-color: var(--sunk); background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 40px 40px; }
.map .tiles { position: absolute; inset: 0; }
.map .tiles img { position: absolute; width: 256px; height: 256px; max-width: none; }
:root[data-theme="dark"] .map .tiles img { filter: brightness(.75) contrast(1.1) saturate(.6); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .map .tiles img { filter: brightness(.75) contrast(1.1) saturate(.6); } }
.map svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.map .ctrl { position: absolute; right: 10px; top: 10px; display: grid; gap: 6px; z-index: 3; }
.map .ctrl button { width: 36px; height: 36px; min-height: 0; padding: 0; font-size: 18px; box-shadow: 0 2px 6px rgb(0 0 0 / .15); }
.map .attr { position: absolute; right: 0; bottom: 0; font-size: 11px; background: color-mix(in srgb, var(--surface) 85%, transparent); padding: 2px 6px; border-top-left-radius: 6px; z-index: 3; color: var(--ink2); }
.map .tip { z-index: 4; }
.map-bar { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 10px; }
.ramp { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
.ramp i { width: 120px; height: 8px; border-radius: 4px; display: inline-block; }

/* ---------- records ---------- */
.rec-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); }
.rec .label { font: 600 12px/1 var(--body); text-transform: uppercase; letter-spacing: .09em; color: var(--muted); }
.rec .val { font: 700 2.2rem/1.1 var(--display); margin-top: 8px; font-variant-numeric: tabular-nums; }
.rec .val small { font: 500 13px var(--body); color: var(--muted); margin-left: 4px; }
.rec p { margin: 4px 0 0; font-size: 13px; color: var(--ink2); }
.rec a { color: inherit; }

/* ---------- profile ---------- */
.form { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); margin-top: 12px; }
.form label, .form1 label { display: grid; gap: 6px; font-size: 13px; font-weight: 600; color: var(--ink2); }
.form .hint { font-weight: 400; color: var(--muted); font-size: 12px; }
.foot { display: flex; gap: 10px; align-items: center; justify-content: flex-end; flex-wrap: wrap; margin-top: 16px; }
.pc-head { display: flex; gap: 14px; align-items: center; }
.pc-head .avatar { width: 56px; height: 56px; font-size: 20px; flex: none; cursor: default; }
.pc-head h3 { text-transform: none; letter-spacing: 0; font-size: 1.5rem; color: var(--ink); }
.pc-head p { margin: 2px 0 0; color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
.pc-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 16px 0; }
.pc-stats div { background: var(--sunk); border-radius: 9px; padding: 10px; }
.pc-stats b { display: block; font: 600 1.3rem/1.1 var(--display); } .pc-stats span { font-size: 12px; color: var(--muted); }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.radio { display: flex; gap: 10px; align-items: flex-start; padding: 12px; border: 1px solid var(--line); border-radius: 10px; cursor: pointer; }
.radio input { width: auto; min-height: 0; margin-top: 3px; accent-color: var(--accent); }
.radio b { display: block; } .radio span { font-size: 13px; color: var(--muted); }
.radio:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.stack { display: grid; gap: 10px; }
