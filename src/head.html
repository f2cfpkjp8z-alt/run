<title>Pace &amp; Pulse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" id="font-sport" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: app shell — top bar with pill tabs (desktop) / bottom tab bar (phone); each tab is a view of tiles, charts and ledgers.
   Every colour is a token; themes swap tokens only. Font sizes are rem so the text-size setting scales them. */
:root, :root[data-theme="volt"] {
  --bg: #0b0f13; --surface: #131a21; --sunk: #1a222b; --raise: #1f2832; --ink: #eef3f6; --ink2: #b4c0cb; --muted: #84919e; --line: #26313c;
  --accent: #c6f24e; --accent-ink: #d4f56e; --accent-soft: #232f14; --on-accent: #0b0f13;
  --c1: #73a40a; --c2: #7e74e1; --hr: #e84d66; --elev: #00aa95;
  --good: #0ca30c; --good-ink: #4fd04f; --warn: #fab219; --warn-ink: #fab219; --crit: #e5534b;
  --z1: #426c00; --z2: #5e8b00; --z3: #7baa2b; --z4: #99ca50; --z5: #b9eb72;
  color-scheme: dark;
}
:root[data-theme="ember"] {
  --bg: #110c0a; --surface: #1b1512; --sunk: #241c18; --raise: #2b221d; --ink: #f6efe9; --ink2: #cfc1b6; --muted: #a08f83; --line: #362a24;
  --accent: #ff8f3f; --accent-ink: #ffa766; --accent-soft: #3a2112; --on-accent: #1a0f08;
  --c1: #dc701c; --c2: #3b93d5; --hr: #e84d66; --elev: #00aa95;
  --z1: #9a3e00; --z2: #bb5d00; --z3: #dd7b2b; --z4: #ff9b50; --z5: #ffbb71;
}
:root[data-theme="glacier"] {
  --bg: #08111c; --surface: #0f1a28; --sunk: #152335; --raise: #1a2a3e; --ink: #eaf3fb; --ink2: #aec2d4; --muted: #8299ad; --line: #22344a;
  --accent: #4fd1f0; --accent-ink: #7fdff5; --accent-soft: #0f3040; --on-accent: #04121c;
  --c1: #00a4c0; --c2: #da6438; --hr: #e84d66; --elev: #3fb27a;
  --z1: #006c84; --z2: #008aa3; --z3: #2ba9c2; --z4: #54c9e3; --z5: #78eaff;
}
:root[data-theme="uv"] {
  --bg: #0d0a15; --surface: #171222; --sunk: #1f182d; --raise: #251d36; --ink: #f1edf8; --ink2: #c5bbd8; --muted: #9488ab; --line: #30263f;
  --accent: #b197ff; --accent-ink: #c4b0ff; --accent-soft: #2a2146; --on-accent: #120c20;
  --c1: #9575e2; --c2: #c0851f; --hr: #e84d66; --elev: #00aa95;
  --z1: #6646a8; --z2: #8264c8; --z3: #a083ea; --z4: #bfa2ff; --z5: #dfc3ff;
}
:root[data-theme="daylight"] {
  --bg: #f3f5f0; --surface: #ffffff; --sunk: #e9ede4; --raise: #f7f9f5; --ink: #12170f; --ink2: #454f40; --muted: #687262; --line: #d8ddd2;
  --accent: #3b7d16; --accent-ink: #2f6612; --accent-soft: #e1efd6; --on-accent: #ffffff;
  --c1: #478416; --c2: #6b50c2; --hr: #c82d40; --elev: #00897d;
  --good: #0ca30c; --good-ink: #006300; --warn: #fab219; --warn-ink: #8a5c00; --crit: #d03b3b;
  --z1: #89c566; --z2: #6ba547; --z3: #4e8626; --z4: #316800; --z5: #144b00;
  color-scheme: light;
}
:root[data-theme="asphalt"] {
  --bg: #121212; --surface: #1e1e1e; --sunk: #262626; --raise: #2c2c2e; --ink: #ffffff; --ink2: #c7c7cc; --muted: #8e8e93; --line: #333336;
  --accent: #fc5200; --accent-ink: #ff7a3d; --accent-soft: #3a1d0d; --on-accent: #ffffff;
  --c1: #fc5200; --c2: #4c9cff; --hr: #ff3b4f; --elev: #9aa3ad;
  --pace: #4c9cff; --vo2: #2fd0a5; --end: #a37cff; --fit: #4c9cff; --fat: #ff6fae; --form: #ffc233;
  --dist: #fc5200; --load: #ffb020; --ef: #5ad06a; --race: #e070ff; --drift: #ffc233;
  --z1: #5a2a10; --z2: #8f3a0c; --z3: #c44606; --z4: #fc5200; --z5: #ff9a5c;
}
/* chart colour per measurement — the same measurement keeps its colour on every chart; themes without their own use --c1/--c2 */
:root { --pace: var(--c1); --vo2: var(--c1); --end: var(--c1); --fit: var(--c1); --fat: var(--c2); --form: var(--c1);
  --dist: var(--c1); --load: var(--c1); --ef: var(--c1); --race: var(--c1); --drift: var(--c2); }
:root[data-theme="asphalt"] body { background: var(--bg); } /* flat, no accent glow */
:root[data-theme="asphalt"] .eyebrow { color: var(--muted); }
:root { --hz1: #8b96a3; --hz2: var(--rt6); --hz3: var(--rt4); --hz4: var(--rt2); --hz5: var(--rt1); } /* Garmin heart-rate zone colours */
:root { --rt1: #e5484d; --rt2: #f2994a; --rt3: #e3b341; --rt4: #3fb950; --rt5: #2bb3a3; --rt6: #3b82f6; --rt7: #a371f7; } /* Garmin-style rating colours (always shown with a label) */
:root[data-theme="daylight"] { --rt1: #cf2e32; --rt2: #d9731f; --rt3: #b98a00; --rt4: #1f8a3a; --rt5: #11867a; --rt6: #2563c9; --rt7: #7c4dd1; }
:root { --display: "Saira Condensed", "Arial Narrow", system-ui, sans-serif; --body: Manrope, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace; --r: 16px; --bnav-h: 0px; }
:root[data-font="classic"] { --display: "Barlow Condensed", "Arial Narrow", sans-serif; --body: "Source Sans 3", system-ui, sans-serif; }
:root[data-font="rounded"] { --display: Nunito, system-ui, sans-serif; --body: Nunito, system-ui, sans-serif; }
:root[data-font="tech"] { --display: "Space Grotesk", system-ui, sans-serif; --body: "Space Grotesk", system-ui, sans-serif; }
:root[data-font="readable"] { --display: "Atkinson Hyperlegible", system-ui, sans-serif; --body: "Atkinson Hyperlegible", system-ui, sans-serif; }
:root[data-font="system"] { --display: system-ui, -apple-system, "Segoe UI", sans-serif; --body: system-ui, -apple-system, "Segoe UI", sans-serif; }
:root[data-size="s"] { font-size: 90%; } :root[data-size="l"] { font-size: 112.5%; } :root[data-size="xl"] { font-size: 125%; }

* { box-sizing: border-box; }
body { color: var(--ink); font: 400 0.9375rem/1.5 var(--body); -webkit-font-smoothing: antialiased;
  background: radial-gradient(900px 500px at 0% -10%, color-mix(in srgb, var(--accent) 9%, transparent), transparent 70%), var(--bg); background-attachment: fixed; }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 16px; }
h1, h2, h3 { font-family: var(--display); font-weight: 700; letter-spacing: .01em; margin: 0; text-wrap: balance; }
h2 { font-size: 1.9rem; line-height: 1.05; }
h3 { font-size: 0.95rem; text-transform: uppercase; letter-spacing: .1em; color: var(--ink2); font-weight: 600; }
a { color: var(--accent-ink); }
.muted { color: var(--muted); margin: 0; } .sm { font-size: 0.8125rem; }
.eyebrow { margin: 0 0 2px; font: 700 0.75rem/1.2 var(--body); text-transform: uppercase; letter-spacing: .14em; color: var(--accent-ink); }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
button, .btn { font: 600 0.875rem/1 var(--body); border-radius: 999px; border: 1px solid var(--line); background: var(--raise); color: var(--ink);
  padding: 10px 16px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 40px; text-decoration: none; transition: border-color .15s, background .15s; }
button:hover, .btn:hover { border-color: var(--accent); }
button:disabled { opacity: .55; cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.btn:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.primary:hover { filter: brightness(1.07); }
.ghost { background: transparent; }
.danger { color: var(--crit); }
.danger.armed { background: var(--crit); color: #fff; border-color: var(--crit); }
.link { background: none; border: 0; color: var(--accent-ink); text-decoration: underline; text-underline-offset: 3px; padding: 8px 0; min-height: 0; }
.wide { width: 100%; }
#file, #folder { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
input, select, textarea { font: 0.9375rem var(--body); padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); min-height: 42px; width: 100%; }
textarea { font: 0.75rem/1.5 var(--mono); min-height: 120px; resize: vertical; }

/* ---------- top bar & tabs ---------- */
.top { position: sticky; top: 0; padding-top: env(safe-area-inset-top, 0px); z-index: 30; background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; gap: 16px; min-height: 64px; }
.brand { display: flex; align-items: center; gap: 10px; color: var(--ink); text-decoration: none; flex: none; }
.brand rect { fill: var(--accent); } .brand path { stroke: var(--on-accent); }
.brand-t { font: 700 1.5rem/1 var(--display); letter-spacing: .02em; text-transform: uppercase; }
.brand small { display: block; font: 500 0.8125rem/1.3 var(--body); color: var(--muted); }
.tabs { display: flex; gap: 4px; margin-right: auto; }
.tabs a { display: flex; align-items: center; padding: 8px 14px; border-radius: 999px; color: var(--ink2); text-decoration: none; font-weight: 600; font-size: 0.9375rem; }
.tabs a:hover { color: var(--ink); background: var(--sunk); }
.tabs a[aria-current="page"] { color: var(--accent-ink); background: var(--accent-soft); }
.top-actions { display: flex; align-items: center; gap: 10px; margin-left: auto; }
.avatar { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; padding: 0; background: var(--accent-soft); color: var(--accent-ink); font: 700 0.9375rem/1 var(--body); border: 1px solid color-mix(in srgb, var(--accent) 35%, transparent); }
.avatar.guest { background: var(--sunk); color: var(--muted); border-color: var(--line); }
.menu-wrap { position: relative; }
/* .menu-wrap > .menu beats the later .card { position: relative } — otherwise the open menu sits in the header's flow and widens the page */
.menu-wrap > .menu { position: absolute; right: 0; top: calc(100% + 8px); width: min(300px, calc(100vw - 32px)); max-height: calc(100dvh - 96px); overflow: auto; padding: 8px; z-index: 40; box-shadow: 0 16px 40px rgb(0 0 0 / .35); transform-origin: top right; }
@media (prefers-reduced-motion: no-preference) { .menu-wrap > .menu:not([hidden]) { animation: pop .14s ease-out both; } }
@keyframes pop { from { opacity: 0; transform: scale(.96) translateY(-4px); } }
.menu .who { padding: 10px; border-bottom: 1px solid var(--line); margin-bottom: 6px; }
.menu .who b { display: block; } .menu .who span { color: var(--muted); font-size: 0.8125rem; }
.menu button { width: 100%; justify-content: flex-start; border: 0; background: transparent; font-weight: 500; border-radius: 10px; }
.menu button:hover { background: var(--sunk); }
.bnav { display: none; }
@media (max-width: 820px) {
  :root { --bnav-h: 64px; }
  .tabs { display: none; }
  .hide-sm { display: none; }
  .bnav { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
    background: color-mix(in srgb, var(--bg) 90%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); }
  .bnav a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; height: var(--bnav-h); color: var(--muted); text-decoration: none; font: 600 0.6875rem/1 var(--body); }
  .bnav a[aria-current="page"] { color: var(--accent-ink); }
  .bnav a[aria-current="page"] svg { background: var(--accent-soft); border-radius: 999px; }
  .bnav svg { width: 40px; height: 26px; padding: 2px 9px; }
  .main { padding-bottom: calc(var(--bnav-h) + 24px + env(safe-area-inset-bottom, 0px)) !important; }
}
.main { padding-block: 8px 24px; }
/* the page always fills the screen, so the version line sits at the bottom even on short pages */
#shell { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; }
#shell > .main { flex: 1 0 auto; width: 100%; display: flex; flex-direction: column; }
#shell > .main > * { width: 100%; }
#shell > .main > .ver { margin-top: auto; padding-top: 28px; }
.banner { margin-top: 16px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding: 12px 14px; border-radius: var(--r); background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent); font-size: 0.875rem; }
.banner .grow { flex: 1 1 260px; min-width: 0; }
.banner.warn { background: color-mix(in srgb, var(--warn) 18%, var(--surface)); border-color: color-mix(in srgb, var(--warn) 40%, transparent); }
.status { font-size: 0.8125rem; color: var(--ink2); min-height: 1.2em; margin-top: 8px; }
.view { margin-top: 12px; }
.vh { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 8px 0 14px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; min-width: 0; box-shadow: inset 0 1px 0 rgb(255 255 255 / .03); }
.ch { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
footer { color: var(--muted); font-size: 0.8125rem; padding-block: 28px 8px; }
.ver { margin: 28px 0 0; text-align: center; font: 0.75rem var(--mono); color: var(--muted); }

/* ---------- tiles ---------- */
.hero { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); }
.tile { display: flex; flex-direction: column; gap: 10px; }
.label { display: inline-flex; align-items: center; gap: 8px; font: 700 0.75rem/1 var(--body); text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
.label::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--accent); flex: none; }
.big { font: 700 3.6rem/0.9 var(--display); letter-spacing: -.01em; }
.big small { font: 600 0.875rem/1 var(--body); color: var(--muted); margin-left: 6px; letter-spacing: 0; }
.chip { display: inline-flex; align-items: center; gap: 6px; font: 600 0.75rem/1 var(--body); padding: 5px 10px; border-radius: 999px; background: var(--sunk); color: var(--ink2); width: fit-content; white-space: nowrap; }
.chip i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; display: inline-block; }
.chip.good { color: var(--good-ink); } .chip.warn { color: var(--warn-ink); } .chip.crit { color: var(--crit); } .chip.acc { color: var(--accent-ink); }
.sub { font-size: 0.8125rem; color: var(--ink2); } .sub .num { color: var(--ink); }
.delta-up { color: var(--good-ink); } .delta-down { color: var(--crit); }
.scale { position: relative; height: 8px; border-radius: 4px; background: linear-gradient(90deg, var(--z1), var(--z3), var(--z5)); margin-top: 4px; }
.scale b { position: absolute; top: -4px; width: 4px; height: 16px; border-radius: 2px; background: var(--ink); box-shadow: 0 0 0 2px var(--surface); transform: translateX(-2px); }
.scale-l { display: flex; justify-content: space-between; font-size: 0.6875rem; color: var(--muted); margin-top: 4px; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; font-size: 0.875rem; margin: 0; }
.kv dt { color: var(--ink2); } .kv dd { margin: 0; text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.kv dd small { color: var(--muted); font-size: 0.75rem; margin-left: 6px; }

/* latest workout card */
.latest { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
.latest .mini-map { aspect-ratio: 4 / 3; max-width: 100%; border-radius: 12px; overflow: hidden; background: var(--sunk); }
.latest .mini-map svg { width: 100%; height: 100%; display: block; }
.latest .lt { margin: 0; font-weight: 700; font-size: 1.125rem; }
@media (max-width: 520px) { .latest { grid-template-columns: 1fr; } }

/* ---------- dashboard (customisable overview) ---------- */
.dash { display: grid; gap: 12px; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-auto-flow: row dense; }
.w { position: relative; min-width: 0; display: flex; flex-direction: column; }
.w > .card { flex: 1; }
.w-S { grid-column: span 1; } .w-M { grid-column: span 2; } .w-L { grid-column: 1 / -1; }
@media (max-width: 1000px) { .dash { grid-template-columns: repeat(2, minmax(0, 1fr)); } .w-M { grid-column: 1 / -1; } }
@media (max-width: 560px) { .dash { grid-template-columns: minmax(0, 1fr); } .w-S, .w-M { grid-column: 1 / -1; } }
.w-ctl { display: none; position: absolute; inset: 8px 8px auto auto; z-index: 3; gap: 4px; padding: 4px; border-radius: 999px; background: var(--bg); border: 1px solid var(--line); box-shadow: 0 6px 18px rgb(0 0 0 / .35); }
.w-ctl button { min-height: 32px; min-width: 32px; padding: 0 9px; font-size: 0.8125rem; border: 0; background: var(--sunk); }
.w-ctl button.on { background: var(--accent); color: var(--on-accent); }
.dash.editing .w-ctl { display: flex; }
.dash.editing .w > .card { outline: 2px dashed color-mix(in srgb, var(--accent) 45%, transparent); outline-offset: -2px; }
.add-list { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 230px), 1fr)); margin-top: 10px; }
.add-list button { justify-content: flex-start; text-align: left; border-radius: 12px; padding: 10px 12px; min-height: 56px; }
.add-list b { display: block; } .add-list span span { display: block; font-weight: 400; font-size: 0.75rem; color: var(--muted); margin-top: 3px; line-height: 1.3; }
.cal { display: grid; grid-template-columns: auto repeat(var(--wk), minmax(0, 1fr)); gap: 3px; align-items: center; font-size: 0.6875rem; color: var(--muted); }
.cal i { display: block; aspect-ratio: 1; border-radius: 3px; background: var(--sunk); max-height: 22px; }
.cal-leg { display: flex; align-items: center; gap: 4px; justify-content: flex-end; font-size: 0.6875rem; color: var(--muted); margin-top: 8px; }
.cal-leg i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.meter { position: relative; height: 10px; border-radius: 5px; background: var(--sunk); margin: 8px 0 4px; overflow: hidden; }
.meter .opt { position: absolute; top: 0; bottom: 0; background: color-mix(in srgb, var(--good) 30%, transparent); }
.meter b { position: absolute; top: -2px; width: 4px; height: 14px; border-radius: 2px; background: var(--ink); transform: translateX(-2px); }
.wkbars { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; align-items: end; height: 64px; margin-top: 6px; }
.wkbars div { display: flex; flex-direction: column; align-items: center; gap: 4px; height: 100%; justify-content: flex-end; font-size: 0.6875rem; color: var(--muted); }
.wkbars i { width: min(100%, 18px); border-radius: 4px 4px 0 0; background: var(--dist); min-height: 2px; }
.wkbars .today { color: var(--ink); font-weight: 700; }

/* workout image */
.img-prev { position: relative; display: grid; place-items: center; background: var(--sunk); border-radius: 12px; padding: 8px; }
.img-prev canvas { max-width: 100%; max-height: 52dvh; width: auto; height: auto; border-radius: 8px; display: block; }
.img-prev .ai-busy { position: absolute; top: 12px; right: 12px; }
.chk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 0 10px; }
/* clickable overview cards */
.w > .card.go { cursor: pointer; transition: border-color .15s, transform .15s; }
.w > .card.go:hover { border-color: color-mix(in srgb, var(--accent) 55%, var(--line)); }
.dash.editing .w > .card.go { cursor: default; }
/* gauge */
.gauge { width: 100%; max-width: 260px; display: block; margin: 0 auto; overflow: visible; }
.gauge .g-val { font: 700 2.1rem/1 var(--display); fill: var(--ink); }
.gwrap { position: relative; width: 100%; max-width: 260px; margin: 0 auto; }
.gwrap > .badge { position: absolute; left: 50%; bottom: 4px; transform: translateX(-50%); }
/* load focus + status strip */
.lf { display: grid; gap: 12px; margin-top: 8px; }
.lf-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; font-size: 0.875rem; }
.lf-row .v { font-family: var(--mono); color: var(--ink2); font-size: 0.8125rem; }
.lf-track { grid-column: 1 / -1; position: relative; height: 12px; border-radius: 6px; background: var(--sunk); overflow: hidden; }
.lf-track i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; }
.lf-tgt { position: absolute; top: 0; bottom: 0; border: 2px solid var(--ink2); border-radius: 6px; z-index: 1; opacity: .7; }
.ts-strip { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 2px; height: 26px; }
.ts-strip i { background: var(--bc, var(--muted)); border-radius: 3px; opacity: .9; }
.race-kv dd span { font-size: 0.6875rem; margin-left: 6px; }
/* Garmin-style training status */
.ts-name { --bc: var(--muted); display: flex; align-items: center; gap: 10px; font: 700 2.1rem/1.05 var(--display); color: var(--bc); margin: 2px 0; }
.ts-name i { width: 12px; height: 12px; border-radius: 50%; background: var(--bc); flex: none; }
:root[data-mode="dark"] .ts-name { filter: brightness(1.15); }
.segbar { position: relative; padding-top: 12px; }
.sb-track { position: relative; height: 10px; border-radius: 5px; overflow: hidden; background: var(--sunk); }
.sb-track span { position: absolute; top: 0; bottom: 0; opacity: .85; border-right: 2px solid var(--surface); }
.sb-mark { position: absolute; top: 0; width: 0; height: 0; transform: translateX(-7px); border: 7px solid transparent; border-top: 9px solid var(--ink); border-bottom: 0; }
.sb-lab { display: flex; justify-content: space-between; gap: 8px; font-size: 0.75rem; color: var(--muted); margin-top: 6px; } .sb-lab b { color: var(--ink); }
.gauge .g-tick { font: 0.625rem var(--mono); fill: var(--muted); }

/* ---------- AI coach ---------- */
.ai-lines { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.ai-lines li { display: grid; grid-template-columns: 1.6em 1fr; gap: 6px; font-size: 0.9375rem; line-height: 1.4; }
.ai-meta { font-size: 0.75rem; color: var(--muted); }
.ai-busy { display: inline-block; width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; vertical-align: -2px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---------- charts ---------- */
.seg { display: inline-flex; background: var(--sunk); border-radius: 999px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; min-height: 32px; padding: 6px 12px; color: var(--ink2); }
.seg button[aria-pressed="true"], .seg button[aria-selected="true"] { background: var(--raise); color: var(--ink); box-shadow: 0 1px 3px rgb(0 0 0 / .25); }
.seg-wide { display: flex; } .seg-wide button { flex: 1; }
.charts { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); }
.chart-card h3 { margin-bottom: 2px; }
.chart-card .cap { font-size: 0.8125rem; color: var(--muted); margin: 0 0 8px; }
.plot { position: relative; width: 100%; }
.plot svg { display: block; width: 100%; height: auto; overflow: visible; touch-action: pan-y; }
.plot .ax { fill: var(--muted); font: 0.6875rem var(--mono); font-variant-numeric: tabular-nums; }
.plot .grid { stroke: var(--line); stroke-width: 1; }
.plot .base { stroke: var(--muted); stroke-width: 1; opacity: .6; }
.plot .fitlab { font: 600 0.8125rem var(--mono); fill: var(--ink); }
.plot .xh { stroke: var(--ink2); stroke-width: 1; stroke-dasharray: 3 3; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 0.8125rem; color: var(--ink2); margin-bottom: 6px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 14px; height: 3px; border-radius: 2px; display: inline-block; }
.legend i.dot { width: 9px; height: 9px; border-radius: 50%; }
.tip { position: absolute; pointer-events: none; background: #0b0f13f2; color: #eef3f6; border: 1px solid #2c3742; border-radius: 10px; padding: 8px 10px; font-size: 0.75rem; line-height: 1.45; white-space: nowrap; z-index: 5; box-shadow: 0 8px 22px rgb(0 0 0 / .3); }
.tip b { font-weight: 700; } .tip .sw { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
.empty { color: var(--muted); font-size: 0.875rem; padding: 24px 0; text-align: center; margin: 0; }

/* ---------- bars / tables ---------- */
.two { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); }
.bars { display: grid; gap: 12px; }
.bar-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; font-size: 0.875rem; }
.bar-row .track { grid-column: 1 / -1; height: 8px; border-radius: 4px; background: var(--sunk); overflow: hidden; }
.bar-row .track i { display: block; height: 100%; border-radius: 4px; background: var(--c1); }
.bar-row .v { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--ink2); font-size: 0.8125rem; }
.bar-row .hint { grid-column: 1 / -1; font-size: 0.75rem; color: var(--muted); margin-top: -2px; }
table.tb { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
table.tb th { text-align: left; font: 700 0.6875rem/1.2 var(--body); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.tb td { padding: 9px 8px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; white-space: nowrap; }
table.tb td.n, table.tb th.n { text-align: right; } table.tb td.n { font-family: var(--mono); font-size: 0.8125rem; }
table.tb .barcell { position: relative; } table.tb .barcell i { position: absolute; left: 0; top: 25%; bottom: 25%; background: var(--accent-soft); border-radius: 3px; z-index: 0; } table.tb .barcell span { position: relative; }
.scroll-x { overflow-x: auto; }

/* ---------- workouts ledger ---------- */
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
.toolbar input { flex: 1 1 220px; width: auto; } .toolbar select { width: auto; flex: 0 1 auto; }
.ledger-card { padding: 4px 8px 8px; }
.ledger-head, .row { display: grid; grid-template-columns: 44px 7rem minmax(0, 1.5fr) repeat(6, minmax(0, .8fr)); gap: 10px; align-items: center; padding: 10px; }
.ledger-head { font: 700 0.6875rem/1.2 var(--body); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); border-bottom: 1px solid var(--line); }
.ledger-head span:nth-child(n+4), .row .m { text-align: right; }
.row { width: 100%; border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: transparent; text-align: left; font: inherit; min-height: 0; cursor: pointer; color: var(--ink); }
a.row { text-decoration: none; }
.row:hover { background: var(--sunk); border-color: var(--line); }
.row .glyph { width: 40px; height: 40px; border-radius: 10px; background: var(--sunk); display: grid; place-items: center; }
.row .glyph svg { width: 34px; height: 34px; }
.row .d { font-size: 0.8125rem; color: var(--ink2); line-height: 1.3; } .row .d span { display: block; color: var(--muted); font-size: 0.75rem; }
.row .nm { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .nm small { font-weight: 500; color: var(--muted); margin-left: 6px; font-size: 0.6875rem; border: 1px solid var(--line); border-radius: 4px; padding: 1px 4px; }
.row .m { font-family: var(--mono); font-variant-numeric: tabular-nums; font-size: 0.875rem; }
.row .m em { display: none; font-style: normal; font-family: var(--body); color: var(--muted); font-size: 0.6875rem; text-transform: uppercase; letter-spacing: .06em; }
.more { margin: 12px auto 0; display: flex; }
@media (max-width: 820px) {
  .ledger-head { display: none; }
  .row { grid-template-columns: 44px repeat(3, minmax(0, 1fr)); gap: 6px 10px; padding: 12px 4px; }
  .row .glyph { grid-row: 1 / 3; }
  .row .nm { grid-column: 2 / 4; grid-row: 1; } .row .d { grid-column: 4; grid-row: 1; text-align: right; } .row .d span { display: none; }
  .row .m { text-align: left; } .row .m em { display: block; }
  .row .m.xs { display: none; }
  .big { font-size: 3rem; }
}

/* ---------- workout detail ---------- */
.back { margin-bottom: 8px; }
.wd-head { display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; margin-bottom: 14px; }
.wd-head h2 { font-size: 2.2rem; }
.wd-head p { margin: 4px 0 0; color: var(--muted); font-size: 0.875rem; }
.stats { display: grid; gap: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
.stat { padding: 11px 13px; box-shadow: inset -1px -1px 0 var(--line); }
.stat span { display: block; font: 700 0.6875rem/1.2 var(--body); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.stat b { font: 700 1.5rem/1.2 var(--display); }
.stat b span { display: inline; font: inherit; text-transform: none; letter-spacing: 0; color: inherit; }
.stat b .badge { display: inline-flex; font: 700 0.6875rem/1 var(--body); color: var(--ink); vertical-align: middle; }
.stat b span.delta-up { color: var(--good-ink); } .stat b span.delta-down { color: var(--crit); }
.stat b small { font: 500 0.75rem var(--body); color: var(--muted); margin-left: 3px; }
.wd-grid { display: grid; gap: 12px; margin-top: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 460px), 1fr)); }
.span2 { grid-column: 1 / -1; }

/* map */
.map { position: relative; width: 100%; height: clamp(260px, 52vw, 460px); border-radius: 12px; overflow: hidden; background: var(--sunk); touch-action: none; cursor: grab; user-select: none; }
.map.no-tiles { background-color: var(--sunk); background-image: linear-gradient(var(--line) 1px, transparent 1px), linear-gradient(90deg, var(--line) 1px, transparent 1px); background-size: 40px 40px; }
.map .tiles { position: absolute; inset: 0; }
.map .tiles img, .smap .tiles img { position: absolute; width: 256px; height: 256px; max-width: none; }
:root[data-mode="dark"] .map .tiles img, :root[data-mode="dark"] .smap .tiles img { filter: brightness(.7) contrast(1.1) saturate(.5); }
.map svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.map svg text { font: 600 0.5625rem var(--mono); fill: var(--ink); }
.map .ctrl { position: absolute; right: 10px; top: 10px; display: grid; gap: 6px; z-index: 3; }
.map .ctrl button { width: 36px; height: 36px; min-height: 0; padding: 0; font-size: 1.125rem; border-radius: 10px; box-shadow: 0 2px 6px rgb(0 0 0 / .25); }
.map .attr, .smap .attr { position: absolute; right: 0; bottom: 0; font-size: 0.6875rem; background: color-mix(in srgb, var(--surface) 85%, transparent); padding: 2px 6px; border-top-left-radius: 6px; z-index: 3; color: var(--ink2); }
.map .tip { z-index: 4; }
.map-bar { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; margin-bottom: 10px; }
.ramp { display: flex; align-items: center; gap: 8px; font-size: 0.75rem; color: var(--muted); }
.ramp i { width: 120px; height: 8px; border-radius: 4px; display: inline-block; }

/* ---------- records ---------- */
.rec-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); }
.rec .val { font: 700 2.3rem/1.1 var(--display); margin-top: 8px; }
.rec .val small { font: 500 0.8125rem var(--body); color: var(--muted); margin-left: 4px; }
.rec p { margin: 4px 0 0; font-size: 0.8125rem; color: var(--ink2); }
.rec a { color: inherit; }

/* ---------- profile ---------- */
.form { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); margin-top: 12px; }
.form label, .form1 label { display: grid; gap: 6px; font-size: 0.8125rem; font-weight: 600; color: var(--ink2); }
.form .hint, .form1 .hint { font-weight: 400; color: var(--muted); font-size: 0.75rem; }
.foot { display: flex; gap: 10px; align-items: center; justify-content: flex-end; flex-wrap: wrap; margin-top: 16px; }
.pc-head { display: flex; gap: 14px; align-items: center; }
.pc-head .avatar { width: 56px; height: 56px; font-size: 1.25rem; flex: none; cursor: default; }
.pc-head h3 { text-transform: none; letter-spacing: 0; font-size: 1.6rem; color: var(--ink); }
.pc-head p { margin: 2px 0 0; color: var(--muted); font-size: 0.875rem; overflow-wrap: anywhere; }
.pc-stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 16px 0; }
.pc-stats div { background: var(--sunk); border-radius: 12px; padding: 10px; }
.pc-stats b { display: block; font: 700 1.35rem/1.1 var(--display); } .pc-stats span { font-size: 0.75rem; color: var(--muted); }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.radio { display: flex; gap: 10px; align-items: flex-start; padding: 12px; border: 1px solid var(--line); border-radius: 12px; cursor: pointer; }
.radio input { width: auto; min-height: 0; margin-top: 3px; accent-color: var(--accent); }
.radio b { display: block; } .radio span { font-size: 0.8125rem; color: var(--muted); }
.radio:has(input:checked) { border-color: var(--accent); background: var(--accent-soft); }
.stack { display: grid; gap: 10px; }
.swatches { display: grid; grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); gap: 8px; }
.swatches button { flex-direction: column; align-items: flex-start; gap: 8px; padding: 10px; border-radius: 12px; min-height: 0; background: var(--sw-bg); color: var(--sw-ink); border: 2px solid transparent; }
.swatches button[aria-pressed="true"] { border-color: var(--accent); }
.swatches button i { display: block; width: 100%; height: 6px; border-radius: 3px; background: var(--sw-acc); }
.method { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 340px), 1fr)); }
.method p, .method li { font-size: 0.875rem; color: var(--ink2); max-width: 65ch; }
.method ol, .method ul { padding-left: 1.2em; margin: 8px 0 0; }
.formula { font: 0.75rem/1.6 var(--mono); background: var(--sunk); border-radius: 10px; padding: 10px 12px; overflow-x: auto; white-space: pre; color: var(--ink); margin-top: 8px; }
details summary { cursor: pointer; font-weight: 600; font-size: 0.875rem; color: var(--ink2); }

/* ---------- auth ---------- */
.auth { min-height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); }
.auth-side { background: var(--surface); color: var(--ink); padding: 48px clamp(16px, 5vw, 64px); display: flex; flex-direction: column; justify-content: center; gap: 32px; border-right: 1px solid var(--line);
  background-image: radial-gradient(600px 400px at 20% 0%, color-mix(in srgb, var(--accent) 16%, transparent), transparent 70%), repeating-linear-gradient(90deg, transparent 0 46px, color-mix(in srgb, var(--accent) 9%, transparent) 46px 48px); }
.auth-side .brand h1 { font-size: 2.6rem; line-height: 1; text-transform: uppercase; } .auth-side .brand small { font-size: 0.9375rem; }
.auth-points { list-style: none; padding: 0; margin: 0; display: grid; gap: 14px; font-size: 1rem; max-width: 40ch; color: var(--ink2); }
.auth-points li { padding-left: 16px; border-left: 3px solid var(--accent); }
.auth-points b { color: var(--ink); }
.auth-main { display: grid; place-items: center; padding: 32px 16px; }
.auth-card { width: min(440px, 100%); display: grid; gap: 14px; padding: 24px; }
.auth-card h2 { font-size: 1.7rem; }
#authLocal, #authFire, #profilePick { display: grid; gap: 12px; }
.auth-note { margin: 0; padding: 10px 12px; border-radius: 10px; background: var(--accent-soft); font-size: 0.875rem; }
.form1 { display: grid; gap: 12px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opt { font-weight: 400; color: var(--muted); }
.form-err { margin: 0; color: var(--crit); font-size: 0.8125rem; }
.fine { margin: 0; font-size: 0.75rem; color: var(--muted); }
.plist { display: grid; gap: 8px; margin-top: 10px; }
.plist button { justify-content: flex-start; gap: 12px; padding: 10px 12px; min-height: 56px; text-align: left; border-radius: 12px; }
.plist .avatar { width: 36px; height: 36px; font-size: 0.8125rem; flex: none; }
.plist b { display: block; } .plist span span { font-weight: 400; font-size: 0.8125rem; color: var(--muted); }
.or { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 0.8125rem; margin-top: 14px; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
@media (max-width: 820px) { .auth { grid-template-columns: 1fr; } .auth-side { padding-block: 28px; gap: 18px; border-right: 0; border-bottom: 1px solid var(--line); } .auth-points { font-size: 0.875rem; } }

/* ---------- share, dialog, feed ---------- */
.share-btn { min-height: 32px; padding: 6px 12px; font-size: 0.8125rem; gap: 6px; }
.dlg { width: min(460px, calc(100vw - 32px)); max-height: calc(100dvh - 32px); overflow: auto; padding: 20px; color: var(--ink); box-shadow: 0 24px 64px rgb(0 0 0 / .5); }
.dlg::backdrop { background: rgb(0 0 0 / .55); }
.dlg h2 { font-size: 1.6rem; margin-bottom: 6px; }
.dlg p { margin: 0 0 12px; font-size: 0.875rem; color: var(--ink2); }
.dlg .x { position: absolute; right: 10px; top: 10px; width: 36px; min-height: 36px; padding: 0; border: 0; font-size: 1.25rem; background: transparent; }
.dlg .chk { display: flex; gap: 10px; align-items: center; font-size: 0.875rem; padding: 6px 0; }
.dlg .chk input { width: auto; min-height: 0; accent-color: var(--accent); }
.linkrow { display: flex; gap: 8px; } .linkrow input { flex: 1; min-width: 0; font: 0.8125rem var(--mono); }
.dlg img { width: 100%; border-radius: 10px; border: 1px solid var(--line); margin-bottom: 12px; }
.feed { display: grid; gap: 12px; max-width: 680px; }
.post { display: grid; gap: 12px; }
.post-h { display: flex; gap: 12px; align-items: center; }
.post-h .avatar { flex: none; cursor: default; }
.post-h .who { flex: 1; min-width: 0; } .post-h .who b { display: block; } .post-h .who span { font-size: 0.8125rem; color: var(--muted); }
.post h3 { text-transform: none; letter-spacing: 0; font-size: 1.45rem; color: var(--ink); }
.post-stats { display: flex; gap: 22px; flex-wrap: wrap; }
.post-stats span { display: block; font: 700 0.6875rem/1.2 var(--body); text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
.post-stats b { font: 700 1.45rem/1.2 var(--display); }
.smap { position: relative; width: 100%; height: clamp(200px, 45vw, 320px); border-radius: 12px; overflow: hidden; background: var(--sunk); }
.smap svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.shared-img { width: 100%; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }

.drop { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: color-mix(in srgb, var(--accent) 20%, transparent); border: 3px dashed var(--accent); font: 700 2rem var(--display); color: var(--ink); }
@media (prefers-reduced-motion: no-preference) { .view:not([hidden]) { animation: rise .3s ease both; } }
/* ---------- algorithm info ---------- */
.algo-l { cursor: pointer; text-decoration: underline dotted color-mix(in srgb, currentColor 55%, transparent); text-underline-offset: 3px; text-decoration-thickness: 1px; }
.algo-l:hover { color: var(--accent-ink); }
.algo-list { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); }
.algo-card { flex-direction: column; align-items: stretch; justify-content: flex-start; gap: 8px; text-align: left; border-radius: var(--r); padding: 14px; background: var(--surface); min-height: 0; font-weight: 400; line-height: 1.4; }
.algo-card > span:first-child { display: flex; justify-content: space-between; gap: 8px; align-items: center; flex-wrap: wrap; }
.algo-card b { font: 700 1.1rem/1.2 var(--display); }
.algo-steps { padding-left: 1.2em; margin: 0 0 8px; display: grid; gap: 6px; font-size: 0.875rem; color: var(--ink2); }
.algo-hist { padding-left: 1.1em; margin: 8px 0 0; display: grid; gap: 8px; font-size: 0.8125rem; color: var(--ink2); }
.dlg .chip { font-size: 0.75rem; }
/* status badges */
.badge { --bc: var(--muted); display: inline-flex; align-items: center; gap: 6px; width: fit-content; white-space: nowrap; font: 700 0.75rem/1 var(--body); padding: 5px 10px 5px 8px; border-radius: 999px;
  color: var(--ink); background: color-mix(in srgb, var(--bc) 20%, transparent); border: 1px solid color-mix(in srgb, var(--bc) 55%, transparent); vertical-align: middle; }
.badge i { width: 8px; height: 8px; border-radius: 50%; background: var(--bc); flex: none; }
.badge .algo-l { text-decoration: none; }
.b-top { --bc: var(--rt7); } .b-exc { --bc: var(--rt6); } .b-good { --bc: var(--rt4); } .b-ok { --bc: var(--muted); } .b-warn { --bc: var(--rt2); } .b-bad { --bc: var(--rt1); }
.stat b .badge { font-size: 0.6875rem; margin-left: 4px; }
.bar-row .badge { font-size: 0.625rem; padding: 3px 8px 3px 6px; margin-left: 6px; }
/* “?” explanations: shown inline on desktop, behind a ? button on phones */
.help-btn { display: none; width: 28px; height: 28px; min-height: 0; padding: 0; border-radius: 50%; font: 700 0.875rem/1 var(--body); color: var(--ink2); background: var(--sunk); border: 1px solid var(--line); flex: none; }
.tile > .help-btn, .card > .help-btn { position: absolute; top: 12px; right: 12px; }
.card { position: relative; }
@media (max-width: 820px) {
  .cap, .hint, .fine, .help, .bar-row .hint { display: none !important; }
  .help-btn { display: inline-grid; place-items: center; }
  .ch { flex-wrap: nowrap; } .ch > h3 { flex: 1; min-width: 0; }
}
